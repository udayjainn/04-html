<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Header, 3 Cards, Footer Grid</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: auto 1fr auto;
            gap: 10px;
            height: 100vh;
            width: 100vw;
            padding: 10px;
        }


        .grid-container .card {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }


        .grid-container .card-img-top {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }


        .grid-container .card-body {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-grow: 1;
        }
    </style>
</head>
<body>

<div class="grid-container">
    <div class="box1" style="grid-column: 1 / 4;">
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">Navbar</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="#">Link</a></li>
                    </ul>
                    <form class="d-flex" role="search">
                        <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search"/>
                        <button class="btn btn-outline-success" type="submit">Search</button>
                    </form>
                </div>
            </div>
        </nav>
    </div>

    <div class="box2">
        <div class="card">
            <video src="your-video.mp4" class="card-img-top" controls autoplay muted loop></video>
            <div class="card-body">
                <div>
                    <h5 class="card-title">Card title</h5>
                    <p class="card-text">Some quick example text to build on the card title.</p>
                </div>
                <a href="#" class="btn btn-primary w-100">Go somewhere</a>
            </div>
        </div>
    </div>


    <div class="box3">
        <div class="card">
            <video src="your-video.mp4" class="card-img-top" controls autoplay muted loop></video>
            <div class="card-body">
                <div>
                    <h5 class="card-title">Card title</h5>
                    <p class="card-text">Some quick example text to build on the card title.</p>
                </div>
                <a href="#" class="btn btn-primary w-100">Go somewhere</a>
            </div>
        </div>
    </div>


    <div class="box4">
        <div class="card">
            <video src="your-video.mp4" class="card-img-top" controls autoplay muted loop></video>
            <div class="card-body">
                <div>
                    <h5 class="card-title">Card title</h5>
                    <p class="card-text">Some quick example text to build on the card title.</p>
                </div>
                <a href="#" class="btn btn-primary w-100">Go somewhere</a>
            </div>
        </div>
    </div>


    <div class="box5" style="grid-column: 1 / 4;">
        <footer class="bg-body-tertiary text-center text-lg-start">
            <div class="text-center p-3">
                © 2026 Copyright:
                <a class="text-body fw-bold text-decoration-none" href="#">YourBrand.com</a>
            </div>
        </footer>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
